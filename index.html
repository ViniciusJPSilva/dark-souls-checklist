<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Checklist de troféus e conquistas de Dark Souls em português, com magias, armas raras e progresso salvo no navegador.">
  <title>Dark Souls — Checklist de Conquistas</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Souls Checklist">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/boot.js"></script>
</head>
<body data-plat="steam">
  <header class="hero">
    <nav class="games" id="games" aria-label="Jogo"></nav>
    <p class="eyebrow">Checklist de <span data-termos>conquistas</span></p>
    <h1 id="gameTitle">Dark Souls <span>Remastered</span></h1>

    <button class="plat" id="plat" aria-label="Detalhes de A Alma Negra">
      <span class="ring" id="ring">
        <img id="platIcon" alt="" data-ph="🏆">
      </span>
      <span class="plat-text">
        <span class="tier t-platinum" id="platTier">100%</span>
        <span class="plat-name" id="platName"></span>
        <span class="stats">
          <span><strong id="statTrophies">–</strong> <span data-termos>conquistas</span></span>
          <span id="statGWrap" hidden><strong id="statG">–</strong></span>
          <span><strong id="statItems">–</strong> itens</span>
          <span><strong id="statPct">–</strong></span>
        </span>
      </span>
    </button>
  </header>

  <div class="bar" id="bar">
    <div class="bar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        <input id="search" type="search" placeholder="Buscar magia, arma, NPC, local…" autocomplete="off" enterkeyhint="search">
      </label>

      <div class="bar-row">
        <div class="seg" id="filters" role="group" aria-label="Filtro">
          <button data-filter="all" aria-pressed="true">Todos</button>
          <button data-filter="todo" aria-pressed="false">Pendentes</button>
          <button data-filter="done" aria-pressed="false">Feitos</button>
        </div>

        <div class="menu-wrap">
          <button class="icon-btn" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Opções">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <button role="menuitemcheckbox" id="optEn" data-act="en" aria-checked="false">
              <span class="switch" aria-hidden="true"></span> Nomes em inglês
            </button>
            <div class="menu-group" role="group" aria-labelledby="platLabel">
              <span class="menu-label" id="platLabel">Plataforma</span>
              <div class="plat-seg">
                <button role="menuitemradio" data-act="plat" data-plat="ps" aria-checked="false">PlayStation</button>
                <button role="menuitemradio" data-act="plat" data-plat="xbox" aria-checked="false">Xbox</button>
                <button role="menuitemradio" data-act="plat" data-plat="steam" aria-checked="true">Steam</button>
              </div>
            </div>
            <hr>
            <button role="menuitem" data-act="guia">Materiais de reforço</button>
            <button role="menuitem" data-act="instalar" hidden>Instalar app</button>
            <hr>
            <button role="menuitem" data-act="export">Exportar progresso</button>
            <button role="menuitem" data-act="import">Importar progresso</button>
            <button role="menuitem" data-act="seed">Restaurar da planilha</button>
            <button role="menuitem" data-act="clear" class="danger">Zerar tudo</button>
          </div>
        </div>
      </div>

      <div class="bar-extra" id="barExtra" hidden>
        <div class="ciclo-seg" id="cicloSeg" role="group" aria-label="Mostrar itens até o ciclo">
          <span class="ciclo-label" aria-hidden="true">Até</span>
          <button data-ciclo="NG" aria-pressed="false">NG</button>
          <button data-ciclo="NG+" aria-pressed="false">NG+</button>
          <button data-ciclo="NG++" aria-pressed="true">NG++</button>
        </div>
        <button class="toggle-perd" id="soPerdiveis" aria-pressed="false">Só perdíveis</button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Seções"></nav>
  </div>

  <div class="layout" id="layout">
    <div class="layout-main">
      <main id="app" class="app"></main>
      <p class="empty" id="empty" hidden>Nada encontrado.</p>
    </div>
    <aside class="roteiro" id="roteiro" aria-label="Roteiro" hidden></aside>
  </div>
  <div class="rt-overlay" id="rtOverlay" hidden></div>
  <button class="rt-fab" id="rtFab" aria-controls="roteiro" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm12 10a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM6 11h9a2 2 0 0 0 0-4h-3V5h3a4 4 0 0 1 0 8H6a2 2 0 0 0 0 4h8v2H6a4 4 0 0 1 0-8z"/></svg>
    <span>Roteiro</span>
  </button>

  <footer class="foot">
    <p>Nomes dos troféus conforme a lista oficial em português (PSN/Xbox/Steam); magias, armas e locais conforme a tradução PT-BR do jogo. Imagens: Fextralife e PSNProfiles. O progresso fica salvo apenas neste navegador.</p>
  </footer>

  <dialog class="sheet" id="sheet" aria-label="Detalhes">
    <div class="sheet-panel">
      <span class="grip" aria-hidden="true"></span>
      <button class="icon-btn sheet-close" id="sheetClose" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </dialog>

  <dialog class="dlg" id="dlg">
    <form method="dialog" class="dlg-panel">
      <h3 id="dlgTitle"></h3>
      <p id="dlgText"></p>
      <textarea id="dlgArea" spellcheck="false" hidden></textarea>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost" id="dlgCancel">Cancelar</button>
        <button value="ok" class="btn primary" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
